<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Været i Bergen</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
  <div class="main-grid">
    <div class="weather-grid">
<div class="weather-wrapper">
    <p class="section-label">Bergen i dag</p>
    <a href="today.html" class="forecast-day-link">
      <div class="weather-card">
          <div class="weather-text">
              <p class="weather-uppercase">Været i Bergen i dag</p>
              <p class="weather-temp" id="temp">2°C</p>
              <p class="weather-desc" id="desc">Lett regn</p>
          </div>
          <div class="weather-icon">
            <img id="weather-icon" src="icons/cloudy.svg" alt="Værikon" />
          </div>
          <div class="mobile-card-extra">
            <p class="mobile-card-text"></p>
            <div class="mobile-card-figure"></div>
          </div>
      </div>
    </a>
</div>


  <!-- Rest of today -->
<a href="today.html" class="section-block-link">
  <div class="glass-section">
    <h2>Resten av i dag</h2>
    <div class="forecast-grid hourly"></div>
  </div>
</a>

<!-- Next days -->
<a href="forecast.html" class="section-block-link">
  <div class="glass-section">
    <h2>Kommende dager</h2>
    <div class="forecast-grid daily"></div>
  </div>
</a>
</div>


  <!-- Right: Dynamic picture and text-->
    <section class="visual-panel">
        <img src="icons/bergen7.svg" alt="Bergen illustrasjon" class="bergen-img">

        <div class="custom-text">
            
        </div>

        <div class="custom-figure">
          
        </div>
    </section>



</div>
</div>
</body>
<footer class="site-footer">
© Åshild · Bergen Weather App
Designet og utviklet med kjærlighet til vestlandsvær.
</footer>

</html>
